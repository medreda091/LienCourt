services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Default: SQLite inside the container.
      # To use PostgreSQL instead, uncomment the line below and start
      # the stack with: docker compose --profile postgres up
      # DATABASE_URL: postgresql+psycopg2://shortener:shortener@db:5432/shortener
      DATABASE_URL: sqlite:///./url_shortener.db
    volumes:
      - app-data:/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
